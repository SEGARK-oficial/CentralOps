name: i18n guard

# Fails the PR if the SPA translation catalogs drift: a key present in one locale
# but missing in another (pt/en/es parity), or a t("key") with no catalog entry
# (would render a raw key). Both are regressions that actually happened during the
# i18n rollout, so they're gated here. Fast, no Docker.

on:
  pull_request:
    paths:
      - "frontend/src/i18n/**"
      - "frontend/src/**/*.tsx"
      - "frontend/scripts/check-i18n.mjs"
      - "frontend/scripts/check-i18n-literals.mjs"
      - "frontend/scripts/lib/i18n-literals-core.mjs"
      - "frontend/scripts/i18n-literals-baseline.json"
  push:
    branches: [main]
    paths:
      - "frontend/src/i18n/**"
  workflow_dispatch:

concurrency:
  group: i18n-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n-check:
    name: SPA catalog parity + t() resolution
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    steps:
      # Runner self-hosted: um container que rodou como ROOT pode ter deixado
      # arquivo no workspace (ex.: __pycache__) que o actions/checkout — que roda
      # como github-runner — não consegue apagar (EACCES). Devolve a posse ANTES
      # do checkout. INLINE de propósito: uma action local só existe DEPOIS do
      # checkout, e é o checkout que quebra. No-op em GitHub-hosted.
      - name: Preflight do runner (posse do workspace)
        if: runner.environment == 'self-hosted'
        run: |
          # Devolve a posse do workspace (container root deixa arquivo que o checkout
          # não apaga: EACCES) SEM sudo. O usuário do runner já fala com o socket do
          # Docker, o que equivale a root no host; NOPASSWD não acrescentava proteção
          # e foi removido. O chown roda num container sem rede. Se falhar, RECLAMA
          # alto: um verde mudo faria o EACCES aparecer depois num job sem relação.
          if [ -d "$GITHUB_WORKSPACE" ] && ! docker run --rm --network none \
              -v "$GITHUB_WORKSPACE:/w" alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
              chown -R "$(id -u):$(id -g)" /w; then
            echo "::warning title=chown do workspace falhou::$(hostname) nao devolveu a posse de $GITHUB_WORKSPACE (docker indisponivel?). Espere EACCES no checkout."
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      # The guard is pure Node (no deps) — no install needed.
      - name: Check i18n catalogs
        working-directory: frontend
        run: node scripts/check-i18n.mjs
      # R2-9.3: catraca de literais PT fora do t() (JSX + aria-label/title/
      # placeholder/alt). Baseline versionado em scripts/i18n-literals-
      # baseline.json — falha só quando aparece assinatura NOVA.
      - name: Check PT literal ratchet
        working-directory: frontend
        run: node scripts/check-i18n-literals.mjs
