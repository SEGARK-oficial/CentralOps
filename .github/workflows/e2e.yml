# e2e.yml — Workflow de testes E2E com Playwright e sharding 4-way.
#
# Triggers:
#   - pull_request: shards 1-2 (50% da suíte, feedback rápido)
#   - push main: todos os shards
#   - schedule nightly 03:00 UTC: todos os shards
#
# Arquitetura:
#   - Projeto "setup" roda em job dedicado ANTES dos shards de teste.
#     Isso garante que os storageState de todos os roles estejam prontos.
#   - docker compose sobe o stack E2E (backend + redis) antes do Playwright
#   - e2e/seed.ts popula DB via API
#   - scripts/seed-redis-e2e.sh popula reservoir Redis
#   - 4 shards rodam em paralelo; artefatos de falha são publicados
#
# Sprint 6: adicionados projetos de role múltiplo (viewer/operator/engineer/admin)

name: E2E Tests

# SUPERSEDED por ci.yml (pipeline build-once): o E2E agora roda nos jobs
# `e2e-setup`/`e2e` do ci.yml, que PUXAM a imagem pré-compilada (sem recompilar)
# — incl. o nightly (schedule herdado lá). Mantido só p/ disparo manual.
on:
  workflow_dispatch:

# Cancela runs E2E obsoletos do mesmo ref (push/PR) num burst — só o HEAD
# importa, e o E2E é o maior gerador de jobs (setup + shards, cada um sobe a
# stack). O run AGENDADO (nightly, event_name == 'schedule') NUNCA é cancelado,
# para preservar a cobertura noturna.
concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  COMPOSE_HEALTH_TIMEOUT: 120

jobs:
  # ── Job 1: setup de autenticação (roda antes dos shards) ─────────────────────
  e2e-setup:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 15

    steps:
      # Runner self-hosted: (a) devolve a posse do workspace — container root
      # deixa arquivo que o checkout não apaga (EACCES); (b) garante piso de
      # disco. Este job puxa/constrói imagem, e quando /var/lib/docker enche o
      # sintoma NÃO é "disco cheio": é um COPY que falha, um pull truncado, um
      # pytest com I/O error — o diagnóstico vai parar no lugar errado. Aqui a
      # falha é explícita e ANTES de qualquer trabalho.
      # INLINE de propósito: uma action local só existe DEPOIS do checkout, e é
      # exatamente o checkout que quebra com ENOSPC/EACCES. No-op em
      # GitHub-hosted (runner efêmero, sempre limpo).
      - name: Preflight do runner (posse do workspace + piso de disco)
        if: runner.environment == 'self-hosted'
        env:
          MIN_FREE_GB: "12"
        run: |
          set -uo pipefail
          # Devolve a posse do workspace (container root deixa arquivo que o checkout
          # não apaga: EACCES) SEM sudo. O usuário do runner já fala com o socket do
          # Docker, o que equivale a root no host; NOPASSWD não acrescentava proteção
          # e foi removido. O chown roda num container sem rede. Se falhar, RECLAMA
          # alto: um verde mudo faria o EACCES aparecer depois num job sem relação.
          if [ -d "$GITHUB_WORKSPACE" ] && ! docker run --rm --network none \
              -v "$GITHUB_WORKSPACE:/w" alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
              chown -R "$(id -u):$(id -g)" /w; then
            echo "::warning title=chown do workspace falhou::$(hostname) nao devolveu a posse de $GITHUB_WORKSPACE (docker indisponivel?). Espere EACCES no checkout."
          fi
          avail() { df -BG --output=avail / | tail -1 | tr -dc '0-9'; }
          echo "$(hostname): $(avail)GB livres antes"
          if [ "$(avail)" -lt "$MIN_FREE_GB" ]; then
            echo "::warning::Disco abaixo do piso — podando (escopado, do mais barato ao mais caro)."
            docker system prune -f >/dev/null 2>&1 || true
            [ "$(avail)" -lt "$MIN_FREE_GB" ] && docker buildx prune -f >/dev/null 2>&1 || true  # sem flag de tamanho: em emergencia o alvo e liberar
            [ "$(avail)" -lt "$MIN_FREE_GB" ] && docker image prune -a -f --filter until=24h >/dev/null 2>&1 || true
            [ "$(avail)" -lt "$MIN_FREE_GB" ] && docker image prune -a -f >/dev/null 2>&1 || true
            echo "$(hostname): $(avail)GB livres apos poda"
          fi
          if [ "$(avail)" -lt "$MIN_FREE_GB" ]; then
            MSG="$(hostname) tem $(avail)GB livres e este job exige ${MIN_FREE_GB}GB."
            MSG="${MSG} A poda nao resolveu: falta CAPACIDADE, nao limpeza."
            MSG="${MSG} Recusando rodar para nao morrer no meio do build."
            echo "::error title=Runner sem disco::${MSG}"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Stack E2E POR JOB. As instâncias do pool self-hosted dividem a máquina e o
      # daemon Docker. Com projeto do compose, porta 3000, volumes e tag de imagem
      # fixos, dois shards simultâneos subiam o MESMO compose: um recriava os
      # containers do outro no meio do seed (bootstrap 500 / ECONNRESET). Projeto,
      # porta livre e imagens próprios isolam cada job. O storageState do setup é
      # cookie de sessão, que não depende da porta.
      - name: Isolar a stack E2E deste job
        run: |
          proj="ce2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}-${{ strategy.job-index }}"
          port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          {
            echo "COMPOSE_PROJECT_NAME=${proj}"
            echo "E2E_HTTP_PORT=${port}"
            echo "BASE_URL=http://localhost:${port}"
            echo "E2E_API_IMAGE=centralops:${proj}"
            echo "E2E_FRONTEND_IMAGE=centralops-frontend:${proj}"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # O SO entra na chave: o Chromium baixado depende da distro (o Playwright
      # escolhe o build por `ubuntuXX.YY`). Quando o pool foi para Ubuntu 26.04 o
      # 1.59 nem instalava ("does not support chromium on ubuntu26.04-x64"); com a
      # chave só pelo lockfile, a próxima troca de SO restauraria o build do SO
      # antigo e o install seria PULADO (cache-hit).
      - name: Identificar o SO do runner
        id: os
        run: echo "id=$(. /etc/os-release && echo "${ID}${VERSION_ID}")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.os.outputs.id }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: |
            playwright-${{ steps.os.outputs.id }}-

      - name: Instalar dependências do e2e
        working-directory: e2e
        run: npm ci

      - name: Instalar Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e
        # Sem `--with-deps`: ele chama sudo + apt no host, e o runner não tem (nem
        # deve ter) NOPASSWD. As libs de sistema do Chromium são provisionadas no
        # runner pelo admin, uma vez por SO: `npx playwright install-deps chromium`.
        # Faltando alguma, o launch falha nomeando a lib.
        run: npx playwright install chromium

      - name: Subir stack E2E
        run: |
          docker compose -f compose/docker-compose.e2e.yml up --build -d
          echo "Aguardando healthcheck do backend..."
          for i in $(seq 1 $COMPOSE_HEALTH_TIMEOUT); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
              $(docker compose -f compose/docker-compose.e2e.yml ps -q frontend) 2>/dev/null || echo "starting")
            if [ "$STATUS" = "healthy" ]; then
              echo "Backend healthy após ${i}s"
              break
            fi
            if [ "$i" = "$COMPOSE_HEALTH_TIMEOUT" ]; then
              echo "Backend não ficou healthy em ${COMPOSE_HEALTH_TIMEOUT}s"
              docker compose -f compose/docker-compose.e2e.yml logs centralops frontend
              exit 1
            fi
            sleep 1
          done

      # Diagnóstico: se QUALQUER passo do setup falhar (subida do stack, seed,
      # autenticação), despeja o estado + os logs de TODOS os serviços. Sem isto,
      # uma falha de boot do `centralops` (ex.: migração que aborta) fica invisível
      # — o `up -d` é detached e o stderr do container não vai pro log do job.
      - name: Dump dos logs do stack E2E (diagnóstico em falha)
        if: failure()
        run: |
          echo "===== docker compose ps -a (códigos de saída) ====="
          docker compose -f compose/docker-compose.e2e.yml ps -a
          echo "===== logs (todos os serviços) ====="
          docker compose -f compose/docker-compose.e2e.yml logs --no-color --timestamps

      - name: Executar seed do banco de dados
        working-directory: e2e
        run: npx ts-node seed.ts
        env:
          BASE_URL: ${{ env.BASE_URL }}

      - name: Popular reservoir Redis
        run: bash scripts/seed-redis-e2e.sh

      - name: Rodar projeto de setup (autenticar roles)
        working-directory: e2e
        run: npx playwright test --project=setup
        env:
          BASE_URL: ${{ env.BASE_URL }}
          CI: true

      # Publicar storageStates como artefato para os jobs de shard
      - name: Upload storageStates de autenticação
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auth-states
          path: e2e/.auth/
          retention-days: 1
          # .auth/ é um diretório OCULTO (dotdir). O upload-artifact@v4 ignora
          # arquivos ocultos por padrão (include-hidden-files: false), então os
          # storageState (.auth/*.json) não seriam encontrados. Habilita a inclusão.
          include-hidden-files: true
          if-no-files-found: error

      - name: Derrubar stack E2E
        if: always()
        run: docker compose -f compose/docker-compose.e2e.yml down -v

  # ── Job 2: shards de teste (dependem do setup) ────────────────────────────────
  e2e:
    needs: e2e-setup
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # PR roda shards 1-2; push main e nightly rodam todos os 4
        shard: ${{ (github.event_name == 'pull_request') && fromJSON('[1, 2]') || fromJSON('[1, 2, 3, 4]') }}

    steps:
      # Runner self-hosted: (a) devolve a posse do workspace — container root
      # deixa arquivo que o checkout não apaga (EACCES); (b) garante piso de
      # disco. Este job puxa/constrói imagem, e quando /var/lib/docker enche o
      # sintoma NÃO é "disco cheio": é um COPY que falha, um pull truncado, um
      # pytest com I/O error — o diagnóstico vai parar no lugar errado. Aqui a
      # falha é explícita e ANTES de qualquer trabalho.
      # INLINE de propósito: uma action local só existe DEPOIS do checkout, e é
      # exatamente o checkout que quebra com ENOSPC/EACCES. No-op em
      # GitHub-hosted (runner efêmero, sempre limpo).
