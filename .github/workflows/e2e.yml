        # runner pelo admin, uma vez por SO: `npx playwright install-deps chromium`.
        # Faltando alguma, o launch falha nomeando a lib.
        run: npx playwright install chromium

      # Baixar storageStates gerados pelo job de setup
      - name: Download storageStates de autenticação
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: auth-states
          path: e2e/.auth/

