name: Security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # toda segunda às 6am UTC

jobs:
  pip-audit:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    steps:
      # Runner self-hosted: um container que rodou como ROOT pode ter deixado
      # arquivo no workspace (ex.: __pycache__) que o actions/checkout — que roda
      # como github-runner — não consegue apagar (EACCES). Devolve a posse ANTES
      # do checkout. INLINE de propósito: uma action local só existe DEPOIS do
      # checkout, e é o checkout que quebra. No-op em GitHub-hosted.
      - name: Preflight do runner (posse do workspace)
        if: runner.environment == 'self-hosted'
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Fóssil removido: aqui havia um passo que exportava o pyenv no $GITHUB_PATH,
      # herdado da primeira migração para self-hosted. Ele terminava em
      # `|| echo "WARN: pyenv python não encontrado"` — ou seja, quando o pyenv não
      # existia o passo passava VERDE e a falha só aparecia no passo seguinte como
      # `python: command not found` (exit 127), apontando para o lugar errado.
      # Os runners atuais não usam pyenv: as versões vivem no tool cache, que é
      # exatamente onde o setup-python procura primeiro. Usar a action deixa a
      # versão explícita e funciona igual em GitHub-hosted e self-hosted.
      # NB: Debian não tem o alias `python` (só `python3`); a action cria os dois.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: |
          python --version
          pip install pip-audit

      - name: Run pip-audit
        # Aponta para requirements.txt (mais permissivo para resolver).
        # Quando o lockfile estiver estável em CI, migrar para:
        #   pip-audit -r backend/requirements.lock --strict
        run: pip-audit -r backend/requirements.txt --strict
