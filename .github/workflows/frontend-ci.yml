name: frontend CI

# Typecheck + suíte vitest da SPA. Até aqui NENHUM job rodava os testes do
# frontend: o `ci.yml` só builda a imagem (que agora herda o `tsc` via
# `npm run build`) e o `i18n-guard.yml` só confere catálogos. Os ~2.200 testes
# de componente (foco/teclado dos primitivos, guard de tokens de cor fantasmas,
# encode de path do api.ts) eram verdes por ausência. Rápido, sem Docker.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + vitest (SPA)
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    steps:
      # Mesmo preflight dos outros workflows: um container que rodou como ROOT
      # pode deixar arquivo no workspace que o checkout (github-runner) não
      # apaga. INLINE porque uma action local só existe depois do checkout.
      - name: Preflight do runner (posse do workspace)
        if: runner.environment == 'self-hosted'
        run: |
          # Devolve a posse do workspace (container root deixa arquivo que o checkout
          # não apaga: EACCES) SEM sudo. O usuário do runner já fala com o socket do
          # Docker, o que equivale a root no host; NOPASSWD não acrescentava proteção
          # e foi removido. O chown roda num container sem rede. Se falhar, RECLAMA
          # alto: um verde mudo faria o EACCES aparecer depois num job sem relação.
          if [ -d "$GITHUB_WORKSPACE" ] && ! docker run --rm --network none \
              -v "$GITHUB_WORKSPACE:/w" alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
              chown -R "$(id -u):$(id -g)" /w; then
            echo "::warning title=chown do workspace falhou::$(hostname) nao devolveu a posse de $GITHUB_WORKSPACE (docker indisponivel?). Espere EACCES no checkout."
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Instalar dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck (app + testes)
        working-directory: frontend
        run: npm run typecheck
      - name: Lint (react-hooks/rules-of-hooks, no-script-url)
        working-directory: frontend
        run: npm run lint
      # vitest sai com código 1 quando não encontra nenhum teste: seleção vazia
      # não vira verde.
      - name: Testes (vitest)
        working-directory: frontend
        run: npx vitest run src
