name: helm guard

# Renders the Community Helm chart and asserts the license-keyring wiring
#. The keyring is what verifies the EdDSA license token offline;
# if the chart stops delivering it to the pods, a valid token fail-closes to
# Community on Kubernetes — the exact CE→EE-upgrade blocker this guards. Fast, no
# cluster (helm template only), and 100% Community (no EE reference — golden rule).

on:
  pull_request:
    paths:
      - "kubernetes/helm/**"
  push:
    branches: [main]
    paths:
      - "kubernetes/helm/**"
  workflow_dispatch:

concurrency:
  group: helm-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-render:
    name: Chart render + license-keyring wiring
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    steps:
      # Runner self-hosted: um container que rodou como ROOT pode ter deixado
      # arquivo no workspace (ex.: __pycache__) que o actions/checkout — que roda
      # como github-runner — não consegue apagar (EACCES). Devolve a posse ANTES
      # do checkout. INLINE de propósito: uma action local só existe DEPOIS do
      # checkout, e é o checkout que quebra. No-op em GitHub-hosted.
      - name: Preflight do runner (posse do workspace)
        if: runner.environment == 'self-hosted'
        run: |
          # NÃO usar `|| true` sozinho: sudo sem senha ausente faria o passo passar
          # VERDE com o chown nunca executado, e o EACCES apareceria depois num job
          # sem relação. Testa primeiro e RECLAMA alto.
          if sudo -n true 2>/dev/null; then
            # NÃO usar `|| true` aqui: sudo sem senha ausente faria o passo passar
          # VERDE com o chown nunca executado — e o EACCES só apareceria muito
          # depois, num job sem relação. Testa primeiro e RECLAMA alto.
          if sudo -n true 2>/dev/null; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
          else
            echo "::warning title=sudo sem senha ausente::O usuario '$(id -un)' em $(hostname) nao tem NOPASSWD. O chown do workspace nao roda (EACCES futuro) e 'playwright install --with-deps' falha. Configure /etc/sudoers.d/ para este usuario."
          fi
          else
            echo "::warning title=sudo sem senha ausente::O usuario '$(id -un)' em $(hostname) nao tem NOPASSWD. O chown do workspace nao roda (EACCES futuro) e 'playwright install --with-deps' falha. Configure /etc/sudoers.d/ para este usuario."
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.2
      - name: Render + assert keyring reaches every edition-resolving pod
        run: bash kubernetes/helm/centralops/tests/keyring-render-test.sh
