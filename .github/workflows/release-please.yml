name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Expõe os outputs do release-please para o job de build condicional abaixo.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create Release PR or GitHub Release
        id: release
        # Pinada por commit SHA (v4.x) — NÃO por @v4 flutuante e NÃO bumpada p/ v5
        # (v5 muda o schema de config e quebraria o fluxo de release). Trocar o SHA
        # e o comentário juntos ao atualizar.
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Quando o release-please CRIA um release (tag vX.Y.Z), constrói e publica a
  # imagem com a TAG DA VERSÃO. Necessário porque a tag criada pelo
  # release-please usa o GITHUB_TOKEN padrão, e o GitHub NÃO dispara workflows a
  # partir de eventos gerados pelo GITHUB_TOKEN (proteção anti-recursão) — então
  # o gatilho `on: push: tags: [v*]` do build-and-publish.yml nunca disparava
  # para releases automáticos, e só a tag `latest` (do push em main) era
  # publicada. Construir aqui, no mesmo run, fecha esse gap sem exigir um PAT.
  # ── Release = PROMOVER a imagem já testada, não recompilar ──────────────────
  # O commit do release é este push na main, e o ci.yml do MESMO push compila,
  # roda o sweep + E2E, passa no Trivy e publica ``sha-<commit>``. Recompilar aqui
  # repetia ~45 min de runner para gerar o mesmo artefato — e era o que reprovava
  # release (2.13.0). Este job espera a imagem do ci.yml e só re-tagueia
  # (imagetools, mesmo digest: SBOM, provenance e o gate Trivy herdados). Se o
  # ci.yml deste commit falhar ou a imagem não aparecer, ``build-release-image``
  # abaixo roda o caminho antigo como fallback.
  promote-release-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest  # só API do registry/GitHub — não ocupa o pool
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - name: Isolar DOCKER_CONFIG deste job
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Esperar a imagem testada do ci.yml e promover
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -uo pipefail
          repo="$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          short="${GITHUB_SHA:0:7}"
          ver="${TAG#v}"; major="${ver%%.*}"; rest="${ver#*.}"; minor="${rest%%.*}"
          api="ghcr.io/${repo}"; fe="ghcr.io/${repo}-frontend"
          echo "promoted=false" >> "$GITHUB_OUTPUT"

          ci_state() {  # conclusão do ci.yml deste commit (vazio = ainda rodando)
            gh run list --repo "${{ github.repository }}" --workflow ci.yml \
              --commit "$GITHUB_SHA" --event push --json status,conclusion \
              --jq '.[0] | select(.status == "completed") | .conclusion' 2>/dev/null || true
          }
          ready() { docker buildx imagetools inspect "$1:sha-${short}" >/dev/null 2>&1; }

          deadline=$(( $(date +%s) + 100 * 60 ))
          until ready "$api" && ready "$fe"; do
            state="$(ci_state)"
            if [ -n "$state" ] && [ "$state" != "success" ]; then
              echo "::warning::ci.yml de ${short} terminou '${state}' — sem imagem testada; o fallback recompila."
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::sha-${short} não apareceu em 100 min — o fallback recompila."
              exit 0
            fi
            sleep 60
          done

          for base in "$api" "$fe"; do
            docker buildx imagetools create \
              -t "${base}:v${ver}" -t "${base}:v${major}.${minor}" -t "${base}:v${major}" \
              "${base}:sha-${short}"
            digest="$(docker buildx imagetools inspect "${base}:v${ver}" --format '{{.Manifest.Digest}}')"
            cosign sign --yes "${base}@${digest}"
            echo "promovido ${base}:sha-${short} -> v${ver} (${digest})"
          done
          echo "promoted=true" >> "$GITHUB_OUTPUT"

  # Fallback: só roda quando a promoção não aconteceu (ci.yml falhou/sumiu).
  build-release-image:
    needs: [release-please, promote-release-image]
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && needs.promote-release-image.outputs.promoted != 'true' }}
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    permissions:
      contents: read
      packages: write
      id-token: write       # OIDC p/ assinatura keyless (cosign)
    # SUPPLY-CHAIN: Actions pinadas por commit SHA (com `# vX.Y.Z` legível). Este
    # job assina a imagem de release com a identidade OIDC do repo — pin por SHA
    # remove o vetor de tag flutuante comprometida a montante. Ver nota idêntica em
    # build-and-publish.yml. Bump = trocar SHA + comentário juntos.
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    # A imagem foi dividida em DUAS — `final` (API/uvicorn) e `frontend`
    # (nginx + SPA). O matrix publica AS DUAS com as tags versionadas. Antes só a
    # `final` era buildada aqui → num release automático o frontend NUNCA ganhava
    # a tag vX.Y.Z (o build-and-publish.yml, que faz as duas via matrix, não
    # dispara para tags criadas pelo GITHUB_TOKEN do release-please — anti-recursão
    # do Actions). Sem esta matrix, `centralops-frontend:vX.Y.Z` ficava faltando.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: final
            suffix: ""
          - target: frontend
            suffix: "-frontend"
    steps:
      # Runner self-hosted: (a) devolve a posse do workspace — container root
      # deixa arquivo que o checkout não apaga (EACCES); (b) garante piso de
      # disco. Este job puxa/constrói imagem, e quando /var/lib/docker enche o
      # sintoma NÃO é "disco cheio": é um COPY que falha, um pull truncado, um
      # pytest com I/O error — o diagnóstico vai parar no lugar errado. Aqui a
      # falha é explícita e ANTES de qualquer trabalho.
      # INLINE de propósito: uma action local só existe DEPOIS do checkout, e é
      # exatamente o checkout que quebra com ENOSPC/EACCES. No-op em
      # GitHub-hosted (runner efêmero, sempre limpo).
      - name: Preflight do runner (posse do workspace + piso de disco)
        if: runner.environment == 'self-hosted'
        env:
          MIN_FREE_GB: "12"
        run: |
          set -uo pipefail
          # Devolve a posse do workspace (container root deixa arquivo que o checkout
          # não apaga: EACCES) SEM sudo. O usuário do runner já fala com o socket do
          # Docker, o que equivale a root no host; NOPASSWD não acrescentava proteção
          # e foi removido. O chown roda num container sem rede. Se falhar, RECLAMA
          # alto: um verde mudo faria o EACCES aparecer depois num job sem relação.
          if [ -d "$GITHUB_WORKSPACE" ] && ! docker run --rm --network none \
              -v "$GITHUB_WORKSPACE:/w" alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
              chown -R "$(id -u):$(id -g)" /w; then
            echo "::warning title=chown do workspace falhou::$(hostname) nao devolveu a posse de $GITHUB_WORKSPACE (docker indisponivel?). Espere EACCES no checkout."
          fi
          avail() { df -BG --output=avail / | tail -1 | tr -dc '0-9'; }
          echo "$(hostname): $(avail)GB livres antes"
          if [ "$(avail)" -lt "$MIN_FREE_GB" ]; then
            echo "::warning::Disco abaixo do piso — podando (escopado, do mais barato ao mais caro)."
            docker system prune -f >/dev/null 2>&1 || true
            [ "$(avail)" -lt "$MIN_FREE_GB" ] && docker buildx prune -f >/dev/null 2>&1 || true  # sem flag de tamanho: em emergencia o alvo e liberar
            [ "$(avail)" -lt "$MIN_FREE_GB" ] && docker image prune -a -f --filter until=24h >/dev/null 2>&1 || true
            [ "$(avail)" -lt "$MIN_FREE_GB" ] && docker image prune -a -f >/dev/null 2>&1 || true
            echo "$(hostname): $(avail)GB livres apos poda"
          fi
          if [ "$(avail)" -lt "$MIN_FREE_GB" ]; then
            MSG="$(hostname) tem $(avail)GB livres e este job exige ${MIN_FREE_GB}GB."
            MSG="${MSG} A poda nao resolveu: falta CAPACIDADE, nao limpeza."
            MSG="${MSG} Recusando rodar para nao morrer no meio do build."
            echo "::error title=Runner sem disco::${MSG}"
            exit 1
          fi
      - name: Checkout no tag do release
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Credencial do registry POR JOB. Os runners self-hosted do pool são várias
      # instâncias (/opt/actions-runner-N) na MESMA máquina e com o MESMO usuário:
      # sem isto, todos os jobs dividem ~/.docker/config.json. O post-step do
      # login-action de um job faz `docker logout ghcr.io` e apaga a credencial de
      # outro que ainda está rodando. O buildx leu o arquivo ao iniciar e empurra
      # a imagem normalmente; o cosign lê na hora de assinar e leva UNAUTHORIZED.
      # Foi assim que a v2.16.0 saiu com a imagem `final` publicada e SEM
      # assinatura (o job do frontend terminou 40 min antes). O $RUNNER_TEMP é
      # de cada instância e o runner o esvazia a cada job. Vem ANTES do buildx e
      # do login: os dois gravam no DOCKER_CONFIG (builder e credencial). Os
      # plugins (buildx, compose) moram em /usr/libexec e não dependem dele.
      # Guard: backend/tests/test_workflow_docker_config_isolado.py
      - name: Isolar DOCKER_CONFIG deste job
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige o nome em MINÚSCULAS; github.repository preserva o case. Calcula
      # o ref base (com o suffix do target) uma vez e reusa em meta/cosign.
      - name: Compute lowercase image ref
        id: img
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          name="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=${REGISTRY}/${name}${SUFFIX}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.img.outputs.ref }}
          # tag_name = vX.Y.Z. Tag exata da versão + rolling vX e vX.Y. value=
          # sobrescreve o ref git (o run é disparado por push em main, não pela tag).
          tags: |
            type=semver,pattern=v{{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern=v{{major}},value=${{ needs.release-please.outputs.tag_name }}

      - name: Build and push Docker image (${{ matrix.target }})
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: compose/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Invalida SÓ a camada de patch de SO (ver SECURITY_EPOCH no Dockerfile):
          # sem isto o `apt-get upgrade`/`apk upgrade` fica congelado no cache GHA.
          # run_attempt entra para que um "Re-run" puxe os pacotes do dia.
          build-args: |
            SECURITY_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}
          # Mesmo cache remoto que o ci.yml grava (antes: escopo gha PRÓPRIO, que
          # nunca reaproveitava o compile do CI). Só lê — quem grava é a main.
          cache-from: type=registry,ref=${{ steps.img.outputs.ref }}:${{ matrix.target == 'final' && 'buildcache-api' || 'buildcache' }}
          # SBOM + provenance SLSA anexados (atestações OCI) — paridade com
          # build-and-publish.yml (procurement enterprise/MSSP exige proveniência).
          sbom: true
          provenance: mode=max

      # Assinatura keyless (Sigstore/Fulcio/Rekor) por DIGEST — paridade com o
      # build-and-publish.yml. Verificável com `cosign verify <ref>@<digest>`.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image (keyless)
        shell: bash
        run: cosign sign --yes "${{ steps.img.outputs.ref }}@${{ steps.build.outputs.digest }}"
