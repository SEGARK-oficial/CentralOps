# Build the Docusaurus site and publish it to this repository's GitHub Pages.
#
# CentralOps is public, so Pages is free and publishes directly from this repo —
# no separate docs repo and no PAT required. One-time setup (repo admin):
#   Settings > Pages > Source: "Deploy from a branch" > Branch: gh-pages / (root).
# Published URL: https://docs.segark.com/
# (baseUrl in docs-site/docusaurus.config.ts must match: "/CentralOps/".)

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: write # peaceiris pushes the built site to the gh-pages branch

jobs:
  build-and-publish:
    name: Build and publish docs to GitHub Pages
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    steps:
      # Runner self-hosted: um container que rodou como ROOT pode ter deixado
      # arquivo no workspace (ex.: __pycache__) que o actions/checkout — que roda
      # como github-runner — não consegue apagar (EACCES). Devolve a posse ANTES
      # do checkout. INLINE de propósito: uma action local só existe DEPOIS do
      # checkout, e é o checkout que quebra. No-op em GitHub-hosted.
      - name: Preflight do runner (posse do workspace)
        if: runner.environment == 'self-hosted'
        run: |
          # Devolve a posse do workspace (container root deixa arquivo que o checkout
          # não apaga: EACCES) SEM sudo. O usuário do runner já fala com o socket do
          # Docker, o que equivale a root no host; NOPASSWD não acrescentava proteção
          # e foi removido. O chown roda num container sem rede. Se falhar, RECLAMA
          # alto: um verde mudo faria o EACCES aparecer depois num job sem relação.
          if [ -d "$GITHUB_WORKSPACE" ] && ! docker run --rm --network none \
              -v "$GITHUB_WORKSPACE:/w" alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f \
              chown -R "$(id -u):$(id -g)" /w; then
            echo "::warning title=chown do workspace falhou::$(hostname) nao devolveu a posse de $GITHUB_WORKSPACE (docker indisponivel?). Espere EACCES no checkout."
          fi
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build static site
        working-directory: docs-site
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs-site/build
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
