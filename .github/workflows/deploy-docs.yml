# Build the Docusaurus site and publish it to this repository's GitHub Pages.
#
# CentralOps is public, so Pages is free and publishes directly from this repo —
# no separate docs repo and no PAT required. One-time setup (repo admin):
#   Settings > Pages > Source: "Deploy from a branch" > Branch: gh-pages / (root).
# Published URL: https://docs.segark.com/
# (baseUrl in docs-site/docusaurus.config.ts must match: "/CentralOps/".)

name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: write # peaceiris pushes the built site to the gh-pages branch

jobs:
  build-and-publish:
    name: Build and publish docs to GitHub Pages
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    steps:
      # Runner self-hosted: um container que rodou como ROOT pode ter deixado
      # arquivo no workspace (ex.: __pycache__) que o actions/checkout — que roda
      # como github-runner — não consegue apagar (EACCES). Devolve a posse ANTES
      # do checkout. INLINE de propósito: uma action local só existe DEPOIS do
      # checkout, e é o checkout que quebra. No-op em GitHub-hosted.
      - name: Preflight do runner (posse do workspace)
        if: runner.environment == 'self-hosted'
        run: |
          # NÃO usar `|| true` sozinho: sudo sem senha ausente faria o passo passar
          # VERDE com o chown nunca executado, e o EACCES apareceria depois num job
          # sem relação. Testa primeiro e RECLAMA alto.
          if sudo -n true 2>/dev/null; then
            # NÃO usar `|| true` aqui: sudo sem senha ausente faria o passo passar
          # VERDE com o chown nunca executado — e o EACCES só apareceria muito
          # depois, num job sem relação. Testa primeiro e RECLAMA alto.
          if sudo -n true 2>/dev/null; then
            sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
          else
            echo "::warning title=sudo sem senha ausente::O usuario '$(id -un)' em $(hostname) nao tem NOPASSWD. O chown do workspace nao roda (EACCES futuro) e 'playwright install --with-deps' falha. Configure /etc/sudoers.d/ para este usuario."
          fi
          else
            echo "::warning title=sudo sem senha ausente::O usuario '$(id -un)' em $(hostname) nao tem NOPASSWD. O chown do workspace nao roda (EACCES futuro) e 'playwright install --with-deps' falha. Configure /etc/sudoers.d/ para este usuario."
          fi
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build static site
        working-directory: docs-site
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs-site/build
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
